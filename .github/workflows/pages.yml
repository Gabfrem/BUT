name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      # Le site est statique : rien à compiler, on publie le dépôt tel quel.
      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Mettre en ligne
        id: deployment
        uses: actions/deploy-pages@v4
